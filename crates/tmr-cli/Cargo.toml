[package]
name = "test-memory-r-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The console of TMR (Test Memory R), a DDR5 memory tester for Windows: a session on the console, its logging and its Ctrl+C"
keywords = ["memory", "ram", "ddr5", "overclocking", "stress-test"]
categories = ["hardware-support"]

[lib]
name = "tmr_cli"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[dependencies]
tmr.workspace = true
log = "0.4"
env_logger = "0.11"
ctrlc = "3.5"
chrono = "0.4"
# The ticker's console (VT mode, its width) and Ctrl+C's exit status. The engine enables the other
# features tmr.exe builds the crate with, so it still builds once, with the features it had
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
# The engine's run and reports, driven through the CLI's frontend for the console's goldens
tmr = { workspace = true, features = ["test-support"] }
