[package]
name = "tmr-app"
version.workspace = true
edition.workspace = true
description = "tmr.exe: TMR's crash hooks and CPU gate, then the CLI or the window (TODO 29)"
publish = false

# The output is still target/<profile>/tmr.exe, the path release.yml uploads. Not documented: its
# docs would land where the `tmr` lib's do, doc/tmr/, and one would overwrite the other.
[[bin]]
name = "tmr"
path = "src/main.rs"
doc = false

[features]
# The window (TODO 7): on by default (the owner, 2026-10-23), so a plain build, and every release,
# is the one tmr.exe with both frontends. `--no-default-features` leaves it out: the CLI alone,
# which never compiles Reactor. Toggling it relinks only the bin.
default = ["gui"]
gui = ["dep:tmr-gui"]

[dependencies]
tmr = { path = "../.." }
tmr-cli = { path = "../tmr-cli" }
tmr-gui = { path = "../tmr-gui", optional = true }
log = "0.4"
# The crash handler and the crash box's thread, and the launch's facts (the console, standard
# output, the Windows build): features the engine and the CLI enable already, so the crate builds
# once, as it did
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
