[package]
name = "test-memory-r"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "TMR (Test Memory R), a DDR5 memory tester for Windows that runs TestMem5 configs: tmr.exe, the console and the window"
keywords = ["memory", "ram", "ddr5", "overclocking", "stress-test"]
categories = ["command-line-utilities", "hardware-support"]

# The output is still target/<profile>/tmr.exe, the path release.yml uploads. Not documented: its
# docs would land where the `tmr` lib's do, doc/tmr/, and one would overwrite the other.
[[bin]]
name = "tmr"
path = "src/main.rs"
doc = false

[features]
# The window (TODO 7): on by default (the owner, 2026-10-23), so a plain build, and every release,
# is the one tmr.exe with both frontends. `--no-default-features` leaves it out: the CLI alone,
# which never compiles Reactor. Toggling it relinks only the bin.
default = ["gui"]
gui = ["dep:tmr-gui"]

[dependencies]
tmr.workspace = true
tmr-cli.workspace = true
tmr-gui = { workspace = true, optional = true }
log = "0.4"
# The crash handler and the crash box's thread, and the launch's facts (the console, standard
# output, the Windows build): features the engine and the CLI enable already, but for LibraryLoader,
# tmr.exe's own (the crash report's module base)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
