[package]
name = "test-memory-r-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The window of TMR (Test Memory R), a DDR5 memory tester for Windows: a run's progress in WinUI 3, through windows-reactor"
keywords = ["memory", "ram", "ddr5", "overclocking", "stress-test"]
categories = ["hardware-support", "gui"]

[lib]
name = "tmr_gui"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[dependencies]
tmr.workspace = true
# The console's text of each event, for the Log tab and the log file (TODO 109): the console's own words, one copy of them
tmr-cli.workspace = true
# A preview API (TODO 7): pinned, and migrations expected. No windows-canvas: the chart is XAML shapes.
windows-reactor = "=0.100.0"
serde_json = "1.0"
# The window's logger (`set_boxed_logger` is std's) and its lines' stamps. Both build as they did:
# the CLI's env_logger takes log's std, and the engine takes chrono.
log = { version = "0.4", features = ["std"] }
chrono = "0.4"
# The Open dialog, for a config and for Compare's two results files, and the shell's open, for the
# log, the results and their folders (TODO 109): Reactor has neither
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The engine's report fixtures (`tmr::test_support`), for the reports the window opens (TODO 109)
tmr = { workspace = true, features = ["test-support"] }
# Reactor's recording runtime: its planner, without a screen, for the views a test mounts and updates (TODO 113's dialog)
windows-reactor = { version = "=0.100.0", features = ["test"] }
