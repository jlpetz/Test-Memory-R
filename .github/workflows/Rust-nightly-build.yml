name: Windows Nightly CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    # The shared local/CI build and manifest tools need Python's standard library, including 3.11's tomllib.
    # Select it explicitly; build_environment.ps1 must preserve this PATH precedence when adding the SDK tools.
    - name: 🐍 Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '>=3.11 <4'

    - name: 🦀 Install Rust Nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy

    - name: Select the Windows SDK and C++ tools
      shell: pwsh
      run: ./tools/build_environment.ps1 -InstallSdk -GitHub

    - name: 🔧 Cache cargo dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-nightly-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-nightly

    - name: ✅ Check formatting
      run: cargo +nightly fmt --all -- --check

    - name: Check the build tools
      run: python -B -m unittest discover -s tools -p test_build_tools.py

    # The workspace (TODO 29): the engine, tmr.exe, the CLI and the window (a default feature), and
    # the engine's test-support, which only the CLI's tests turn on
    - name: 🧹 Run clippy
      run: cargo +nightly clippy --workspace --all-targets --all-features -- -D warnings

    # Again without the tests, so the engine is checked as tmr.exe builds it, test-support off.
    # Cargo builds the engine once a command, so above it had the feature, and an engine item only
    # the fixtures still call would raise no dead_code warning
    - name: 🧹 Run clippy, the engine as tmr.exe builds it
      run: cargo +nightly clippy --workspace -- -D warnings

    # tmr.exe without the window (`--no-default-features`), which no release ships, so it still builds
    - name: 🧹 Run clippy, tmr.exe without the window
      run: cargo +nightly clippy -p test-memory-r --no-default-features -- -D warnings

    # tmr.exe with both frontends, as release.yml builds it
    - name: 🚧 Build release version
      run: python tools/build_release.py

    - name: Keep the build manifest
      uses: actions/upload-artifact@v4
      with:
        name: build-manifest
        path: target/release/tmr.build.json
        if-no-files-found: error

    - name: ⚙️ Install cargo-nextest and cargo-audit
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest,cargo-audit

    # The window's tests are of its plain-Rust model and need no Windows App Runtime. The CLI's
    # console goldens are compared byte for byte (.gitattributes keeps their line ends). Every test
    # runs, failing or not, so one run shows every failure (the runners' CPUs differ: some lack AVX-512)
    - name: 🧪 Run tests
      run: cargo +nightly nextest run --workspace --all-targets --no-fail-fast

    # Cargo.lock against the RustSec advisories: a vulnerability fails the job, a warning (an
    # unmaintained crate) is only listed. Plain cargo-audit: actions-rs/audit-check is archived, and
    # posting a check run needs a write token this workflow doesn't have.
    - name: 🔍 Run audit
      run: cargo audit
