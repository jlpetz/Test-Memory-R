name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'  # Matches tags like v1.0.0, v2.1.3, etc.

# Creating the release and uploading to it writes to the repository, and its workflows get a read-only token by default
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v7

    - name: 🦀 Install Rust Nightly
      uses: dtolnay/rust-toolchain@nightly

    # The one tmr.exe, the console and the window (a default feature, the owner's: one download, not two)
    - name: 🚧 Build release binary
      run: cargo +nightly build --release

    - name: 📦 Upload release binary
      uses: softprops/action-gh-release@v3
      # tmr.pdb beside tmr.exe: only the PDB from the same build matches it, and the runner's is gone when the job ends. A file
      # missing fails the job, rather than publishing a release without it.
      with:
        fail_on_unmatched_files: true
        files: |
          target/release/tmr.exe
          target/release/tmr.pdb
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
