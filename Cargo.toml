[package]
name = "tmr"
version = "1.0.0"
edition = "2021"
description = "Test Memory R - High-Performance DDR5 Memory Testing Tool"
authors = ["Your Name <your.email@example.com>"]

[dependencies]
windows = { version = "0.61", features = [
    "Win32_System_Memory", 
    "Win32_Foundation", 
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security"
] }
num_cpus = "1.17"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cache-size = "0.7"
raw-cpuid = "11.5"
ctrlc = "3.4"         # For CTRL+C signal handling
chrono = { version = "0.4", features = ["serde"] }  # For timestamp handling

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

# Enable CPU-specific optimizations
[target.'cfg(target_arch = "x86_64")'.dependencies]