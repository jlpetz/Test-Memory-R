[package]
name = "tmr"
version = "1.0.0"
edition = "2024"
description = "Test Memory R - High-Performance DDR5 Memory Testing Tool"
authors = ["Your Name <your.email@example.com>"]

[dependencies]
### windows = { version = "0.62", features = [
windows = { version = "0.62", features = [
    "Win32_System_Memory",
	"Win32_System_Kernel",
    "Win32_Foundation", 
	"Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",    # Add this for CreateFileA, FILE_SHARE_*, etc.
    "Win32_System_IO",              # Add this for DeviceIoControl
	"Win32_System_ProcessStatus",    # Add for GetNumaHighestNodeNumber
	"Win32_System_WindowsProgramming", # Sometimes needed for NUMA
	"Win32_System_SystemServices",
	"Win32_System_Registry",
	"Win32_System_LibraryLoader",
	"Win32_System_EventLog",         # WHEA monitoring (#63): EvtSubscribe/EvtNext/EvtRender
] }
num_cpus = "1.17"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }  # For timestamp handling
ctrlc = "3.5"         # For CTRL+C signal handling
raw-cpuid = "11.6"
globset = "0.4"

[dev-dependencies]
proptest = "1.4"  # Property-based testing for calibration correctness properties

# --------------------------------------------
# BUILD PROFILES
# --------------------------------------------

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true 

[profile.release-with-debug]
inherits = "release"
lto = false
strip = false
debug = 2
split-debuginfo = "unpacked"
codegen-units = 1         # keep layout stable for profiling
panic = "abort"           # match your release panic strategy
# Note: For profiling with frame pointers, build with:
# RUSTFLAGS="-C force-frame-pointers=yes" cargo build --profile release-with-debug

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

