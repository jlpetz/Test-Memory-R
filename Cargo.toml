# The engine, `tmr`, a library at the repo root; the executable is `crates/tmr-app`'s, the command
# line `crates/tmr-cli`'s and the window `crates/tmr-gui`'s (TODO 29). `src/` stays where it is, so
# every path to it in the docs holds.
[workspace]
members = [".", "crates/tmr-app", "crates/tmr-cli", "crates/tmr-gui"]
# All but the window, so a plain `cargo build`, `cargo test` or `cargo run` never compiles Reactor:
# `--features tmr-app/gui` builds it into tmr.exe
default-members = [".", "crates/tmr-app", "crates/tmr-cli"]

[workspace.package]
version = "1.0.0"
edition = "2024"

[package]
name = "tmr"
version.workspace = true
edition.workspace = true
description = "Test Memory R - High-Performance DDR5 Memory Testing Tool"
authors = ["Your Name <your.email@example.com>"]
# A library only: tmr.exe is `crates/tmr-app`'s bin
autobins = false

[dependencies]
### windows = { version = "0.62", features = [
windows = { version = "0.62", features = [
    "Win32_System_Memory",
	"Win32_System_Kernel",
    "Win32_Foundation", 
	"Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",    # Add this for CreateFileA, FILE_SHARE_*, etc.
    "Win32_System_IO",              # Add this for DeviceIoControl
	"Win32_System_ProcessStatus",    # Add for GetNumaHighestNodeNumber
	"Win32_System_WindowsProgramming", # Sometimes needed for NUMA
	"Win32_System_SystemServices",
	"Win32_System_Registry",
	"Win32_System_LibraryLoader",
	"Win32_System_EventLog",         # WHEA monitoring (#63): EvtSubscribe/EvtNext/EvtRender
] }
num_cpus = "1.17"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }  # For timestamp handling
raw-cpuid = "11.6"
globset = "0.4"

[features]
# What the CLI's tests drive the engine with (`src/test_support.rs`, TODO 29): its run's code through
# the CLI's frontend, and the reports the console renders. Off by default, and tmr-cli turns it on
# for its tests only, so a plain build of tmr.exe or the window has none of it. Cargo builds the
# engine once a command, with the features of every target the command builds: with
# `--all-targets` the engine every target links has it, tmr.exe's under `cargo build` too, and
# clippy checks the engine only with it on, so its fixtures' calls hide dead code. Hence CI's
# second clippy, `--workspace` with no `--all-targets`.
test-support = []

[dev-dependencies]
proptest = "1.4"  # Property-based testing for calibration correctness properties

# --------------------------------------------
# BUILD PROFILES
# --------------------------------------------

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true 

[profile.release-with-debug]
inherits = "release"
lto = false
strip = false
debug = 2
split-debuginfo = "unpacked"
codegen-units = 1         # keep layout stable for profiling
panic = "abort"           # match your release panic strategy
# Note: For profiling with frame pointers, build with:
# RUSTFLAGS="-C force-frame-pointers=yes" cargo build --profile release-with-debug

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

