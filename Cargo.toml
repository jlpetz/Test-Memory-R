# The engine, `tmr`, a library at the repo root; the executable is `crates/tmr-app`'s, the command
# line `crates/tmr-cli`'s and the window `crates/tmr-gui`'s (TODO 29). `src/` stays where it is, so
# every path to it in the docs holds.
[workspace]
members = [".", "crates/tmr-app", "crates/tmr-cli", "crates/tmr-gui"]
# What a plain `cargo build`, `cargo run` or `cargo test` takes: the root is a package, so without
# this they would take it alone, and build no tmr.exe. The window comes in through tmr-app's default
# `gui` feature; `--workspace` adds tmr-gui's own tests.
default-members = [".", "crates/tmr-app", "crates/tmr-cli"]

# The four crates are released together, at one version (TODO 104): a new one moves this and the
# three pins below
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Jarrod Petz"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jlpetz/Test-Memory-R"

# On crates.io the crates are `test-memory-r-*` (`tmr` and `tmr-cli` are others'); each keeps the
# name its code knows it by. Pinned exactly: the window's title and the console's banner read
# different crates' versions, so a build takes the four from one release.
[workspace.dependencies]
tmr = { package = "test-memory-r-engine", version = "=0.1.0", path = "." }
tmr-cli = { package = "test-memory-r-cli", version = "=0.1.0", path = "crates/tmr-cli" }
tmr-gui = { package = "test-memory-r-gui", version = "=0.1.0", path = "crates/tmr-gui" }

[package]
name = "test-memory-r-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "The engine of TMR (Test Memory R), a DDR5 memory tester for Windows: its tests, memory allocation, sessions and results"
readme = "README.crates-io.md"
keywords = ["memory", "ram", "ddr5", "overclocking", "stress-test"]
categories = ["hardware-support"]
# What the crate ships: without a list it would take every tracked file, doc/, research/ and tools/ among them. testdata/ is the
# tests' fixtures.
include = ["/src/**", "/build.rs", "/README.crates-io.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/testdata/**"]
# A library only: tmr.exe is `crates/tmr-app`'s bin
autobins = false

[lib]
name = "tmr"

# Windows only. The baseline check (src/lib.rs) lets docs.rs's build through (build.rs).
[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_EventLog", # WHEA monitoring (TODO 63): EvtSubscribe, EvtNext, EvtRender
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
num_cpus = "1.17"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }  # For timestamp handling
raw-cpuid = "11.6"
globset = "0.4"

[features]
# What the CLI's tests drive the engine with (`src/test_support.rs`, TODO 29): its run's code through
# the CLI's frontend, and the reports the console renders. Off by default, and tmr-cli turns it on
# for its tests only, so a plain build of tmr.exe or the window has none of it. Cargo builds the
# engine once a command, with the features of every target the command builds: with
# `--all-targets` the engine every target links has it, tmr.exe's under `cargo build` too, and
# clippy checks the engine only with it on, so its fixtures' calls hide dead code. Hence CI's
# second clippy, `--workspace` with no `--all-targets`.
test-support = []

[dev-dependencies]
proptest = "1.4"  # Property-based testing for calibration correctness properties

# --------------------------------------------
# BUILD PROFILES
# --------------------------------------------

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Function names and source lines in tmr.pdb, written beside tmr.exe, so a crash's address names its function and line: keep each shipped
# build's PDB. On Windows the symbols never go in the exe, which holds only the PDB's file name and a GUID that pairs the two. The code is
# the same without them (2026-10-23: all 1,176 test functions, the hot loops' spill table, and tmr.exe's size to the byte), unlike with
# `debug = 2`.
debug = "line-tables-only"
strip = false

# Release with full debug info (`debug = 2`: variables too, not only lines), for a profiler or debugger that wants them: `cargo build
# --profile release-with-debug` gives target/release-with-debug/tmr.exe and its tmr.pdb. Release's fat LTO too: without it the code isn't
# release's (3.91 MB of .text against 4.11 MB). The full debug info itself moves 1% of the instructions, in 42 of the 1158 functions
# asm_fingerprint.py covers (other registers or order, mostly rescans and setup); the hot loops' spill table is release's. The CPU baseline
# is .cargo/config.toml's, as for every profile. No frame pointers: x64 Windows walks a stack by the unwind tables every function has.
# Never pass a flag through RUSTFLAGS: it replaces config.toml's flags, the baseline with them.
[profile.release-with-debug]
inherits = "release"
debug = 2

