[package]
name = "tmr"
version = "1.0.0"
edition = "2021"
description = "Test Memory R - High-Performance DDR5 Memory Testing Tool"
authors = ["Your Name <your.email@example.com>"]

[dependencies]
windows = { version = "0.56", features = [
    "Win32_System_Memory", 
    "Win32_Foundation", 
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security"
] }
num_cpus = "1.16"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

# Enable CPU-specific optimizations
[target.'cfg(target_arch = "x86_64")'.dependencies]