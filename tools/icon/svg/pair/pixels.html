<!doctype html><html><head><style>body{margin:0;padding:10px;background:#2b2b2b;color:#ddd;font:13px Segoe UI}#out{display:flex;flex-wrap:wrap;gap:10px;width:1580px}figure{margin:0}figcaption{margin-top:2px}</style></head><body><div id='out'></div><script>function draw(src,p,bg,label){const f=document.createElement('figure');document.getElementById('out').appendChild(f);const img=new Image();img.onload=()=>{const s=document.createElement('canvas');s.width=p;s.height=p;const c=s.getContext('2d');c.fillStyle=bg;c.fillRect(0,0,p,p);c.drawImage(img,0,0,p,p);const m=document.createElement('canvas');const z=Math.max(3,Math.floor(300/p));m.width=p*z;m.height=p*z;const k=m.getContext('2d');k.imageSmoothingEnabled=false;k.drawImage(s,0,0,p*z,p*z);f.appendChild(m);const t=document.createElement('figcaption');t.textContent=label;f.appendChild(t);};img.src=src;}draw('icon96.svg',96,'#1c1c1c','96 px');draw('icon96.svg',96,'#f3f3f3','96 px');draw('icon80.svg',80,'#1c1c1c','80 px');draw('icon80.svg',80,'#f3f3f3','80 px');draw('icon72.svg',72,'#1c1c1c','72 px');draw('icon72.svg',72,'#f3f3f3','72 px');draw('icon64.svg',64,'#1c1c1c','64 px');draw('icon64.svg',64,'#f3f3f3','64 px');draw('icon60.svg',60,'#1c1c1c','60 px');draw('icon60.svg',60,'#f3f3f3','60 px');draw('icon48.svg',48,'#1c1c1c','48 px');draw('icon48.svg',48,'#f3f3f3','48 px');draw('icon40.svg',40,'#1c1c1c','40 px');draw('icon40.svg',40,'#f3f3f3','40 px');draw('icon36.svg',36,'#1c1c1c','36 px');draw('icon36.svg',36,'#f3f3f3','36 px');draw('icon32.svg',32,'#1c1c1c','32 px');draw('icon32.svg',32,'#f3f3f3','32 px');draw('icon30.svg',30,'#1c1c1c','30 px');draw('icon30.svg',30,'#f3f3f3','30 px');draw('icon24.svg',24,'#1c1c1c','24 px');draw('icon24.svg',24,'#f3f3f3','24 px');draw('icon20.svg',20,'#1c1c1c','20 px');draw('icon20.svg',20,'#f3f3f3','20 px');draw('icon16.svg',16,'#1c1c1c','16 px');draw('icon16.svg',16,'#f3f3f3','16 px');</script></body></html>
